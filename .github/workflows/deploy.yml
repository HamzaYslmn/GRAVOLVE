name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [app/**, .github/workflows/deploy.yml] # docs-only pushes don't deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # ponytail: tests run locally before each change; add `npm test` back if CI should gate deploys
      - run: npm ci --no-audit --no-fund
      # relative base: works at /GRAVOLVE/ and on a custom domain
      - run: npm run build -- --base=./
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
